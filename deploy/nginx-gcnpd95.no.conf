# /etc/nginx/sites-available/gcnpd95.no
# Static site: the build output (dist/) is copied to /var/www/gcnpd95 by the GitHub Action.
# After enabling it, run: sudo certbot --nginx -d gcnpd95.no -d www.gcnpd95.no
# (certbot adds the HTTPS server block and the redirect from http to https).

# Long cache for hashed build files, no cache for index.html so new versions show at once.
map $uri $gcnpd95_expires {
    default     -1;
    ~^/assets/  1y;
}

server {
    listen 80;
    listen [::]:80;
    server_name gcnpd95.no www.gcnpd95.no;

    root /var/www/gcnpd95;
    index index.html;
    charset utf-8;

    # The page may only load from and talk to this server: uploaded files cannot be sent anywhere.
    # Keep in sync with deploy/csp.txt.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    expires $gcnpd95_expires;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
